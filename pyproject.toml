[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sereneai-engine"
version = "2.0.0"
description = "Production-ready Agentic AI Teledentistry Consultation System"
authors = [
    {name = "SereneAI Team", email = "team@sereneai.com"}
]
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["ai", "agentic", "teledentistry", "langchain", "langgraph", "healthcare"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # LangChain 1.0+ Core
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-community>=1.0.0",

    # LangGraph 1.0+
    "langgraph>=1.0.0",
    "langgraph-checkpoint>=1.0.0",
    "langgraph-checkpoint-postgres>=1.0.0",
    "langgraph-checkpoint-sqlite>=1.0.0",

    # LLM Providers
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=1.0.0",  # Claude fallback
    "langchain-openai>=1.0.0",     # Optional: OpenAI models

    # Embeddings & Vector Stores
    "langchain-huggingface>=1.0.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",

    # Vision & Image Processing
    "ultralytics>=8.3.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "opencv-python>=4.9.0",
    "pillow>=10.3.0",

    # API & Web Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Security
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.3",
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Database
    "psycopg[binary]>=3.1.0",  # PostgreSQL
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # Data Validation & Serialization
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Observability & Monitoring
    "langsmith>=0.2.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "prometheus-client>=0.20.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "cachetools>=5.3.0",

    # CLI
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",  # For testing FastAPI
    "faker>=25.0.0",
    "freezegun>=1.5.0",
]

ui = [
    "streamlit>=1.35.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

all = [
    "sereneai-engine[dev,ui,docs]",
]

[project.urls]
Homepage = "https://github.com/Dentalization/SereneAI-Engine"
Documentation = "https://docs.sereneai.com"
Repository = "https://github.com/Dentalization/SereneAI-Engine"
Issues = "https://github.com/Dentalization/SereneAI-Engine/issues"

[project.scripts]
sereneai = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--asyncio-mode=auto",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.black]
line-length = 100
target-version = ["py311"]
