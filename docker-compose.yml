version: '3.8'

services:
  # ============================================================================
  # PostgreSQL - For LangGraph Checkpoints
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sereneai_postgres_v2
    environment:
      POSTGRES_DB: sereneai_v2
      POSTGRES_USER: sereneai
      POSTGRES_PASSWORD: changeme
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sereneai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sereneai_network
    restart: unless-stopped

  # ============================================================================
  # Redis - For Long-term Memory Store
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: sereneai_redis_v2
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sereneai_network
    restart: unless-stopped

  # ============================================================================
  # pgAdmin - Database Management UI (Optional)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sereneai_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sereneai.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - sereneai_network
    restart: unless-stopped
    profiles:
      - admin

  # ============================================================================
  # Redis Commander - Redis Management UI (Optional)
  # ============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sereneai_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - sereneai_network
    restart: unless-stopped
    profiles:
      - admin

  # ============================================================================
  # Prometheus - Metrics Collection (Optional)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sereneai_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - sereneai_network
    restart: unless-stopped
    profiles:
      - monitoring

  # ============================================================================
  # Grafana - Metrics Visualization (Optional)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: sereneai_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - sereneai_network
    restart: unless-stopped
    profiles:
      - monitoring

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  sereneai_network:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
